name: 部署網站

# 網站程式、設定或品牌素材有變更 → 重新建置並部署；也會被每週更新呼叫
# 主要：Cloudflare Pages（https://onenago.pages.dev）
# 過渡：GitHub Pages（https://kukuteddy.github.io/OneNaGo/），確認 Cloudflare 正常後即可移除
on:
  push:
    branches: [main]
    paths: ["apps/web/**", "config/**", "brand/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  workflow_call:
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: false
      CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions:
  contents: read
  pages: write
  id-token: write
  deployments: write

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  CF_PROJECT: onenago

jobs:
  cloudflare:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    steps:
      - name: 檢查 Cloudflare 設定
        id: cfg
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ACCOUNT" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::還沒設定 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，略過 Cloudflare 部署"
          fi

      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/checkout@v5
      - if: steps.cfg.outputs.ready == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - if: steps.cfg.outputs.ready == 'true'
        name: 建置
        working-directory: apps/web
        run: npm ci && npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ""
          NEXT_PUBLIC_SITE_URL: https://${{ env.CF_PROJECT }}.pages.dev

      - if: steps.cfg.outputs.ready == 'true'
        name: 建立 Pages 專案（第一次才需要）
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4.158.0 pages project list | grep -qw "$CF_PROJECT" \
            || npx --yes wrangler@4.158.0 pages project create "$CF_PROJECT" --production-branch=main

      - if: steps.cfg.outputs.ready == 'true'
        name: 部署
        working-directory: apps/web
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.158.0 pages deploy out --project-name="$CF_PROJECT" --branch=main --commit-dirty=true

  github-pages-build:
    name: GitHub Pages（過渡）
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /OneNaGo
          NEXT_PUBLIC_SITE_URL: https://kukuteddy.github.io/OneNaGo
      - run: touch out/.nojekyll # 讓 GitHub Pages 提供 _next/ 底下的檔案
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/out

  github-pages-deploy:
    needs: github-pages-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
