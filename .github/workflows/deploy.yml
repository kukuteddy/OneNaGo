name: 部署網站

# 網站程式、設定或品牌素材有變更 → 重新建置並部署；也會被每週更新呼叫
on:
  push:
    branches: [main]
    paths: ["apps/web/**", "config/**", "brand/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: /OneNaGo
          NEXT_PUBLIC_SITE_URL: https://kukuteddy.github.io/OneNaGo
      - run: touch out/.nojekyll # 讓 GitHub Pages 提供 _next/ 底下的檔案
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/web/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
