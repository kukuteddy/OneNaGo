name: 每週更新資料

# 每週一 03:00（台灣時間）：抓最新政府資料 → 寫入 Supabase → 重新部署網站
on:
  schedule:
    - cron: "0 19 * * 0"
  workflow_dispatch:

permissions:
  contents: write # 回存快取
  pages: write
  id-token: write

concurrency:
  group: weekly
  cancel-in-progress: false

jobs:
  etl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    defaults:
      run:
        working-directory: services/etl
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }} # 選填：自動找店家 IG
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/etl/pyproject.toml
      - run: pip install -e .

      - name: 檢查資料庫連線設定
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::缺少 GitHub Secret：SUPABASE_DB_URL（設定方式見 docs/ADMIN.md）"
            exit 1
          fi

      - name: 還原政府原始檔快取（約 300MB，不進版控）
        uses: actions/cache@v4
        with:
          path: services/etl/cache/mof
          key: mof-${{ github.run_id }}
          restore-keys: mof-

      - run: onenago-etl migrate
      - run: onenago-etl build --all

      - name: 回存快取（定位、IG 比對；下次只查新的）
        run: |
          if [ -n "$(git status --porcelain -- cache/)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add cache/geocode_cache.json $(ls cache/ig_discovery.json 2>/dev/null)
            git commit -m "chore(etl): update caches [skip ci]"
            git push
          fi

  deploy:
    needs: etl
    uses: ./.github/workflows/deploy.yml
