}

<script>
const META = __META__;
const DATA = __DATA__;
const LANDMARKS = META.landmarks;
const PAGE = 30;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const state = { q: "", tab: "all", from: 0, kind: "", sort: "rec", view: "list", shown: PAGE };

const TABS = [
  { id: "all", label: "全部", test: () => true },
  { id: "ig", label: "有 IG 作品", test: m => !!m.ig },
  { id: "verified", label: "已核對", test: m => m.verified },
  { id: "new", label: "新開幕", test: m => m.years != null && m.years < 1 },
  { id: "veteran", label: "老店 5 年+", test: m => m.years != null && m.years >= 5 },
];

function km(a, b) {
  const R = 6371, r = x => x * Math.PI / 180;
  const dLat = r(b[0] - a[0]), dLng = r(b[1] - a[1]);
  const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a[0])) * Math.cos(r(b[0])) * Math.sin(dLng / 2) ** 2;
  return 2 * R * Math.asin(Math.sqrt(h));
}
function fmtDist(d) { return d == null ? "" : d < 1 ? Math.round(d * 1000 / 10) * 10 + "m" : d.toFixed(1) + "km"; }
function hue(s) { let h = 0; for (const c of s) h = (h * 31 + c.codePointAt(0)) % 360; return h; }
function initial(name) { const m = name.match(/[一-鿿A-Za-z]/); return m ? m[0].toUpperCase() : "甲"; }

function score(m) {
  return (m.verified ? 40 : 0) + (m.ig ? 25 : 0) + (m.line ? 8 : 0) + (m.prec === "address" ? 5 : 0)
       + Math.min(m.years ?? 0, 10) * 2 - (m.warn ? 30 : 0);
}

function filtered() {
  const tab = TABS.find(t => t.id === state.tab);
  const lm = LANDMARKS[state.from];
  const q = state.q.trim().toLowerCase();
  let rows = DATA.filter(m => tab.test(m)
    && (!state.kind || m.kind === state.kind)
    && (!q || (m.name + m.reg + m.address + (m.ig || "")).toLowerCase().includes(q)));
  rows.forEach(m => m.dist = m.lat != null ? km([lm.lat, lm.lng], [m.lat, m.lng]) : null);
  const by = {
    rec: (a, b) => score(b) - score(a),
    dist: (a, b) => (a.dist ?? 1e9) - (b.dist ?? 1e9),
    old: (a, b) => (b.years ?? -1) - (a.years ?? -1),
    new: (a, b) => (a.years ?? 1e9) - (b.years ?? 1e9),
  }[state.sort];
  return rows.sort((a, b) => by(a, b) || a.name.localeCompare(b.name, "zh-Hant"));
}

function chipsHtml(m) {
  const chips = [];
  if (m.years != null) chips.push(m.years < 1 ? `<span class="chip new">新開幕</span>` : `<span class="chip years">開業 ${Math.floor(m.years)} 年</span>`);
  if (m.verified) chips.push(`<span class="chip ok">多來源核對</span>`);
  if (m.ig) chips.push(`<span class="chip">${{ search: "IG（自動比對）", ugc: "IG（客人回報）" }[m.igSrc] || "IG 作品"}</span>`);
  if (m.line) chips.push(`<span class="chip">LINE 預約</span>`);
  if (m.price) chips.push(`<span class="chip price">約 NT$${m.price}（客人回報）</span>`);
  if (m.photos && m.photos.length) chips.push(`<span class="chip">客人作品 ${m.photos.length}</span>`);
  if (m.warn) chips.push(`<span class="chip warn">${esc(m.warn)}</span>`);
  if (m.lat == null) chips.push(`<span class="chip warn">待補地址</span>`);
  return chips.join("");
}

function actionsHtml(m, onMap) {
  const gmaps = onMap && m.lat != null
    ? `https://www.google.com/maps/dir/?api=1&destination=${m.lat},${m.lng}`
    : "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(m.name + " " + m.address);
  const line = m.line ? (m.line.startsWith("http") ? m.line : "https://line.me/R/ti/p/" + m.line) : "";
  return `
    ${m.ig ? `<a class="primary" href="https://www.instagram.com/${esc(m.ig)}/" target="_blank" rel="noopener">看作品</a>` : ""}
    ${line ? `<a href="${esc(line)}" target="_blank" rel="noopener">LINE</a>` : ""}
    <a href="${gmaps}" target="_blank" rel="noopener">${onMap ? "導航" : "地圖・評論"}</a>
    ${META.sb.url ? `<button class="contrib" type="button" data-contrib="${esc(m.id)}">補充資訊</button>`
      : !m.ig && META.reportUrl ? `<a class="report" href="${esc(META.reportUrl.replace("SHOPID", encodeURIComponent(m.id)).replace("SHOPNAME", encodeURIComponent(m.name)))}" target="_blank" rel="noopener">這家店的 IG 是？</a>` : ""}
    ${m.phone ? `<span class="phone">${esc(m.phone)}</span>` : ""}`;
}

function photoUrl(path) { return `${META.sb.url}/storage/v1/object/public/ugc-photos/u/${encodeURIComponent(path)}`; }

function thumbHtml(m) {
  const p = m.photos && m.photos[0];
  return `<div class="thumb" style="background:hsl(${hue(m.name)} 45% 62%)">${esc(initial(m.name))}${p ? `<img src="${photoUrl(p.photo_path)}" alt="${esc(m.name)} 的作品" loading="lazy">` : ""}<small>${p ? `作品 ${m.photos.length} 張` : m.ig ? "看 IG 作品" : "暫無作品"}</small></div>`;
}

function card(m) {
  return `<article class="item gutter" id="m-${m.id}">
    ${thumbHtml(m)}
    <div class="body">
      <div class="name">${esc(m.name)}<span class="kind">${m.kind === "studio" ? "工作室" : "實體店"}</span></div>
      ${m.reg && m.reg !== m.name ? `<div class="reg">登記名稱：${esc(m.reg)}</div>` : ""}
      <div class="meta"><span class="road">${esc(m.road || m.address || "地址未提供")}</span><span class="dist">${fmtDist(m.dist)}</span></div>
      <div class="chips">${chipsHtml(m)}</div>
      <div class="actions">${actionsHtml(m, false)}</div>
    </div>
  </article>`;
}

function renderList(rows) {
  const list = $("#list");
  if (!rows.length) { list.innerHTML = `<div class="empty">沒有符合條件的店家，換個關鍵字或篩選試試</div>`; return; }
  const part = rows.slice(0, state.shown);
  list.innerHTML = part.map(card).join("") +
    (rows.length > part.length ? `<button class="more" id="more" type="button">再顯示 ${Math.min(PAGE, rows.length - part.length)} 家（共 ${rows.length} 家）</button>` : "");
  const more = $("#more");
  if (more) more.onclick = () => { state.shown += PAGE; render(); };
}

/* ---------- 地圖：Leaflet + OpenStreetMap，第一次切到地圖才載入 ---------- */
let LMAP = null, LAYER = null, LEAFLET = null;

function loadLeaflet() {
  if (LEAFLET) return LEAFLET;
  LEAFLET = new Promise((ok, fail) => {
    const css = document.createElement("link");
    css.rel = "stylesheet"; css.href = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.css";
    document.head.appendChild(css);
    const s = document.createElement("script");
    s.src = "https://unpkg.com/leaflet@1.9.4/dist/leaflet.js";
    s.onload = ok; s.onerror = fail;
    document.head.appendChild(s);
  });
  return LEAFLET;
}

function showSheet(m) {
  const sheet = $("#sheet");
  sheet.innerHTML = `${thumbHtml(m)}
    <div class="body">
      <div class="name">${esc(m.name)}<span class="kind">${m.kind === "studio" ? "工作室" : "實體店"}</span></div>
      <div class="meta"><span class="road">${esc(m.road || m.address)}</span><span class="dist">${fmtDist(m.dist)}</span></div>
      <div class="chips">${chipsHtml(m)}</div>
      <div class="actions">${actionsHtml(m, true)}</div>
    </div>
    <button class="close" type="button" aria-label="關閉">×</button>`;
  sheet.hidden = false;
  $("#maphint").hidden = true;
  sheet.querySelector(".close").onclick = () => { sheet.hidden = true; };
}

function renderMap(rows) {
  loadLeaflet().then(() => drawMap(rows)).catch(() => {
    $("#lmap").innerHTML = `<div class="maploading">地圖載入失敗，請檢查網路後再試一次</div>`;
    LEAFLET = null;
  });
}

function drawMap(rows) {
  const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#FF6827";
  if (!LMAP) {
    $("#lmap").innerHTML = "";
    LMAP = L.map("lmap");
    L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>',
    }).addTo(LMAP);
    LAYER = L.layerGroup().addTo(LMAP);
    LANDMARKS.forEach(l => L.marker([l.lat, l.lng], {
      icon: L.divIcon({ className: "", html: `<span class="lm-label">${esc(l.name)}</span>`, iconSize: null }),
      interactive: false, keyboard: false,
    }).addTo(LMAP));
    LMAP.on("click", () => { $("#sheet").hidden = true; });
  }
  setTimeout(() => LMAP.invalidateSize(), 0);
  LAYER.clearLayers();
  $("#sheet").hidden = true;
  const pts = rows.filter(m => m.lat != null);
  pts.forEach(m => {
    const mk = L.circleMarker([m.lat, m.lng], {
      radius: m.ig ? 9 : 7, color: "#fff", weight: 2,
      fillColor: m.prec === "address" ? accent : "#a59d9a", fillOpacity: 1,
    });
    mk.on("click", e => { L.DomEvent.stopPropagation(e); showSheet(m); });
    mk.addTo(LAYER);
  });
  if (pts.length) LMAP.fitBounds(pts.map(m => [m.lat, m.lng]), { padding: [30, 30], maxZoom: 16 });
  else LMAP.setView([LANDMARKS[0].lat, LANDMARKS[0].lng], 14);
  const hint = $("#maphint");
  hint.hidden = false;
  hint.textContent = pts.length ? `${pts.length} 家店・點標記看店家` : "沒有符合條件的店家";
}

function render() {
  const rows = filtered();
  const counts = Object.fromEntries(TABS.map(t => [t.id, DATA.filter(t.test).length]));
  $("#tabs").innerHTML = TABS.map(t => `<button type="button" data-tab="${t.id}" aria-pressed="${t.id === state.tab}">${t.label}<span class="count">${counts[t.id]}</span></button>`).join("");
  $("#summary").textContent = `${rows.length} 家店・距離以「${LANDMARKS[state.from].name}」計算`;
  if (state.view === "list") renderList(rows); else renderMap(rows);
}

function setView(v) {
  state.view = v;
  $("#listview").hidden = v !== "list";
  $("#mapview").hidden = v !== "map";
  $("#viewlabel").textContent = v === "list" ? "地圖" : "列表";
  $("#viewicon").innerHTML = v === "list"
    ? '<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>'
    : '<path d="M4 6h16M4 12h16M4 18h16"/>';
  render();
}

LANDMARKS.forEach((l, i) => $("#from").add(new Option(l.name, i)));
$("#updated").textContent = "更新於 " + META.updated;
$("#q").addEventListener("input", e => { state.q = e.target.value; state.shown = PAGE; render(); });
$("#tabs").addEventListener("click", e => { const b = e.target.closest("button"); if (b) { state.tab = b.dataset.tab; state.shown = PAGE; render(); } });
$("#from").addEventListener("change", e => { state.from = +e.target.value; if (state.sort === "rec") { state.sort = "dist"; $("#sort").value = "dist"; } render(); });
$("#kind").addEventListener("change", e => { state.kind = e.target.value; state.shown = PAGE; render(); });
$("#sort").addEventListener("change", e => { state.sort = e.target.value; render(); });
$("#viewbtn").addEventListener("click", () => {
  const v = state.view === "list" ? "map" : "list";
  try { history.replaceState(null, "", v === "map" ? "#map" : location.pathname); } catch (e) {}
  setView(v);
});
/* ---------- 使用者補充資訊（Supabase：只能新增、讀彙整結果） ---------- */
const SB = META.sb || {};
const sbHeaders = extra => Object.assign({ apikey: SB.key }, extra || {});
const dlg = $("#contrib");
let cfShop = null;

function clientId() {
  try {
    let id = localStorage.getItem("onenago_cid");
    if (!id) { id = crypto.randomUUID(); localStorage.setItem("onenago_cid", id); }
    return id;
  } catch (e) { return null; }
}

function igHandle(v) {
  const m = String(v || "").trim().match(/(?:instagram\.com\/)?@?([A-Za-z0-9_.]{1,30})\/?(?:\?.*)?$/);
  return m ? m[1].toLowerCase() : "";
}

async function loadCommunity() {
  if (!SB.url) return;
  try {
    const get = path => fetch(`${SB.url}/rest/v1/${path}`, { headers: sbHeaders() }).then(r => r.ok ? r.json() : []);
    const [sum, photos] = await Promise.all([
      get("report_summary?select=*"),
      get("approved_photos?select=*&order=created_at.desc"),
    ]);
    const byId = Object.fromEntries(DATA.map(m => [m.id, m]));
    for (const s of sum) {
      const m = byId[s.merchant_id];
      if (!m) continue;
      if (s.kind === "ig" && !m.ig && s.reporters >= 2) { m.ig = s.value; m.igSrc = "ugc"; }
      if (s.kind === "line" && !m.line && s.reporters >= 2) m.line = s.value;
      if (s.kind === "price" && s.price_median) m.price = Math.round(s.price_median / 10) * 10;
      if ((s.kind === "closed" || s.kind === "moved") && s.reporters >= 2 && !m.warn)
        m.warn = s.kind === "closed" ? "多人回報已歇業" : "多人回報已搬家";
    }
    for (const p of photos) { const m = byId[p.merchant_id]; if (m) (m.photos = m.photos || []).push(p); }
    if (sum.length || photos.length) render();
  } catch (e) { /* 連不上時照常顯示原本的資料 */ }
}

function showFields() {
  const kind = (document.querySelector("#cf input[name=kind]:checked") || {}).value;
  document.querySelectorAll("#cf [data-for]").forEach(el => { el.hidden = !el.dataset.for.split(" ").includes(kind); });
  $("#cf-text-label").textContent = kind === "new_shop" ? "店名、地址、IG（知道多少寫多少）"
    : kind === "moved" ? "新地址（知道的話）" : "哪裡有誤？正確的是什麼？";
}

function openContrib(m) {
  cfShop = m;
  $("#cf").reset();
  $("#cf-preview").hidden = true;
  $("#cf-msg").textContent = ""; $("#cf-msg").className = "msg";
  $("#cf-go").disabled = false;
  $("#cf-kinds").hidden = !m;
  $("#cf-newshop").hidden = !!m;
  $("#cf-shop").textContent = m ? m.name : `${META.city}・告訴我們還有哪家店`;
  const r = document.querySelector(`#cf input[name=kind][value="${m ? (m.ig ? "photo" : "ig") : "new_shop"}"]`);
  if (r) r.checked = true;
  showFields();
  if (dlg.showModal) dlg.showModal(); else dlg.setAttribute("open", "");
  if (r) r.focus();
}

async function shrink(file) {
  // 重新繪製成 JPEG：縮到最長邊 1600px，同時去掉 EXIF（含拍攝地點）
  const img = await createImageBitmap(file);
  const s = Math.min(1, 1600 / Math.max(img.width, img.height));
  const c = document.createElement("canvas");
  c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  return new Promise((ok, fail) => c.toBlob(b => b ? ok(b) : fail(new Error("照片處理失敗")), "image/jpeg", 0.85));
}

$("#cf").addEventListener("change", e => { if (e.target.name === "kind") showFields(); });
$("#cf-cancel").addEventListener("click", () => dlg.close());
$("#cf-file").addEventListener("change", e => {
  const f = e.target.files[0], pv = $("#cf-preview");
  if (f) { pv.src = URL.createObjectURL(f); pv.hidden = false; } else pv.hidden = true;
});

$("#cf").addEventListener("submit", async e => {
  e.preventDefault();
  const kind = document.querySelector("#cf input[name=kind]:checked").value;
  const msg = $("#cf-msg"), go = $("#cf-go");
  const say = (t, cls) => { msg.textContent = t; msg.className = "msg " + (cls || ""); };
  const price = parseInt($("#cf-price").value, 10);
  const row = { merchant_id: cfShop ? cfShop.id : "new:" + META.vertical + ":" + META.city,
                merchant_name: cfShop ? cfShop.name : null, kind, client_id: clientId() };
  if (kind === "ig") {
    const v = igHandle($("#cf-value").value);
    if (!v) return say("請填 IG 帳號，例如 @shop_nail", "err");
    row.value = v;
  }
  if (kind === "line") {
    const v = $("#cf-value").value.trim();
    if (!v) return say("請填 LINE ID 或加好友網址", "err");
    row.value = v.slice(0, 200);
  }
  if (kind === "price" || kind === "photo") {
    if (!isNaN(price)) {
      if (price < 100 || price > 20000) return say("價格請填 100 到 20000 之間", "err");
      row.price_twd = price;
    } else if (kind === "price") return say("請填價格", "err");
  }
  if (kind === "wrong" || kind === "moved" || kind === "new_shop") {
    const t = $("#cf-text").value.trim();
    if (!t && kind !== "moved") return say("請簡單說明一下", "err");
    row.value = t || null;
  }
  go.disabled = true; say("送出中…");
  try {
    if (kind === "photo") {
      const f = $("#cf-file").files[0];
      if (!f) { go.disabled = false; return say("請先選一張照片", "err"); }
      const blob = await shrink(f);
      const name = crypto.randomUUID() + ".jpg";
      const up = await fetch(`${SB.url}/storage/v1/object/ugc-photos/u/${name}`, {
        method: "POST", body: blob,
        headers: sbHeaders({ Authorization: "Bearer " + SB.key, "Content-Type": "image/jpeg" }),
      });
      if (!up.ok) throw new Error("照片上傳失敗");
      row.photo_path = name;
    }
    const r = await fetch(`${SB.url}/rest/v1/reports`, {
      method: "POST", body: JSON.stringify(row),
      headers: sbHeaders({ "Content-Type": "application/json", Prefer: "return=minimal" }),
    });
    if (!r.ok) throw new Error("送出失敗");
    say(["photo", "wrong", "new_shop"].includes(kind)
      ? "收到了，謝謝！審核通過後就會出現在頁面上。"
      : "收到了，謝謝！兩個人以上回報相同內容就會自動顯示。", "ok");
    setTimeout(() => { if (dlg.open) dlg.close(); }, 2500);
  } catch (err) {
    go.disabled = false;
    say(err.message + "，請稍後再試一次", "err");
  }
});

document.addEventListener("click", e => {
  const b = e.target.closest("[data-contrib]");
  if (b) openContrib(DATA.find(d => d.id === b.dataset.contrib));
});
if (SB.url) { $("#addshop").hidden = false; $("#addshop").addEventListener("click", () => openContrib(null)); }

if (location.hash === "#map") setView("map"); else render();
loadCommunity();
</script>
